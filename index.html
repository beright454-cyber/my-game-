<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TANISKA MONDAL GAME HUB - 16 Guti Pro</title>
    <!-- PeerJS for seamless zero-config free P2P WebRTC real-time sync -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Canvas Confetti for realistic celebration fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for crisp modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Hind+Siliguri:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-primary: #ffdf79;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --neon-blue: #00d2ff;
            --neon-pink: #ff2a85;
            --wood-dark: #1f0729;
            --wood-mid: #380d45;
            --wood-border: #d4af37;
            --line-color: rgba(255, 245, 220, 0.88);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 20%, #3a094a 0%, #1c0326 55%, #0d0113 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 12px;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle glowing ambient particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 15% 30%, rgba(255, 42, 133, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(0, 210, 255, 0.12) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 2px;
            margin-bottom: 4px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.15rem, 3.5vw, 1.65rem);
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(255, 223, 121, 0.5), 0 0 25px rgba(255, 42, 133, 0.8);
            letter-spacing: 2px;
            font-weight: 900;
        }

        .subtitle {
            font-size: clamp(0.75rem, 2.2vw, 0.9rem);
            color: #f8bbd0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Top Online pill */
        .top-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .conn-dot.online {
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;
        }

        .share-btn {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .share-btn:hover { transform: scale(1.04); }
        .share-btn:active { transform: scale(0.96); }

        /* Dynamic turn banner */
        .turn-announcer {
            position: relative;
            z-index: 1;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            font-weight: 700;
            min-height: 26px;
            margin-bottom: 6px;
            text-align: center;
            color: #ffe600;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .game-arena {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 28px);
            width: 100%;
            max-width: 1100px;
            flex: 1;
        }

        /* Side Player Dashboards */
        .player-dashboard {
            width: clamp(140px, 16vw, 180px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 12px 10px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        .dashboard-baba { border-color: rgba(0, 210, 255, 0.4); }
        .dashboard-baba.winner-active {
            border-color: #00d2ff;
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.9);
            transform: scale(1.05);
        }

        .dashboard-taniska { border-color: rgba(255, 42, 133, 0.4); }
        .dashboard-taniska.winner-active {
            border-color: #ff2a85;
            box-shadow: 0 0 35px rgba(255, 42, 133, 0.9);
            transform: scale(1.05);
        }

        .player-avatar {
            font-size: 2.2rem;
            position: relative;
            display: inline-block;
            margin-bottom: 2px;
        }

        .crown-icon {
            display: none;
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px #ffd700);
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-6px); }
        }

        .player-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .baba-title { color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.7); }
        .taniska-title { color: #ff66aa; text-shadow: 0 0 10px rgba(255,102,170,0.7); }

        .alive-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffe600;
        }

        .digital-score-box {
            background: #000000;
            border-radius: 12px;
            padding: 6px 4px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.95);
        }

        .score-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffd54f;
            margin-bottom: 1px;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: 900;
            font-family: 'Share Tech Mono', monospace;
            line-height: 1;
        }
        .score-baba { color: #00e5ff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
        .score-taniska { color: #ff4081; text-shadow: 0 0 12px rgba(255, 64, 129, 0.8); }

        /* REALISTIC 16 GUTI WOODEN/BRASS BOARD WRAPPER */
        .board-wrapper {
            position: relative;
            /* Perfectly proportioned for standard 360 x 520 coordinate grid */
            width: min(92vw, 420px, calc((100vh - 170px) * 0.692));
            aspect-ratio: 360 / 520;
            background: radial-gradient(ellipse at center, #2e1038 0%, #1a0820 70%, #110316 100%);
            border-radius: clamp(16px, 4vw, 24px);
            border: clamp(3px, 1vw, 5px) solid var(--wood-border);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.85),
                inset 0 0 35px rgba(212, 175, 55, 0.25),
                0 0 25px rgba(255, 42, 133, 0.2);
            flex-shrink: 0;
        }

        /* Sharp SVG board lines */
        svg.board-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        svg.board-svg line {
            stroke: var(--line-color);
            stroke-width: 3.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
        }

        /* 37 Responsive Anchor Sockets */
        .node-anchor {
            position: absolute;
            transform: translate(-50%, -50%);
            width: clamp(32px, 8.5vw, 42px);
            height: clamp(32px, 8.5vw, 42px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        /* Realistic brass socket ring embedded into the board */
        .socket-ring {
            width: clamp(12px, 3.2vw, 16px);
            height: clamp(12px, 3.2vw, 16px);
            border-radius: 50%;
            background: radial-gradient(circle, #200529 35%, #461652 75%, #d4af37 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.95), 0 1px 3px rgba(212, 175, 55, 0.5);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* 3D MARBLE GUTI (Gemstones) */
        .guti {
            position: absolute;
            width: clamp(24px, 6.6vw, 32px);
            height: clamp(24px, 6.6vw, 32px);
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.22s ease;
            z-index: 10;
        }

        /* Baba = Royal Sapphire 3D Marble */
        .guti-blue {
            background: radial-gradient(circle at 30% 25%, #e1f5fe 0%, #29b6f6 30%, #0288d1 65%, #012a4a 100%);
            box-shadow: 
                0 4px 10px rgba(0, 0, 0, 0.85),
                0 0 14px rgba(41, 182, 246, 0.75),
                inset -2px -3px 6px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        /* Taniska = Rose Quartz Gem 3D Marble */
        .guti-pink {
            background: radial-gradient(circle at 30% 25%, #fff0f5 0%, #ff4081 32%, #c2185b 65%, #4a0022 100%);
            box-shadow: 
                0 4px 10px rgba(0, 0, 0, 0.85),
                0 0 14px rgba(255, 64, 129, 0.75),
                inset -2px -3px 6px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        /* Selected Piece: Subtle realistic 3D float + gold glow (STRICTLY NO GREEN ARROWS) */
        .node-anchor.selected .guti {
            transform: scale(1.35) translateY(-5px);
            filter: brightness(1.22) drop-shadow(0 10px 14px rgba(255, 215, 0, 0.9));
        }

        .node-anchor.selected .socket-ring {
            border-color: #ffd700;
            box-shadow: 0 0 12px #ffd700;
        }

        .board-locked {
            pointer-events: none !important;
            opacity: 0.96;
        }

        /* Action Buttons Row */
        .action-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            min-height: 38px;
        }

        .custom-btn {
            background: #ffeb3b;
            color: #21033a;
            border: none;
            padding: 8px 22px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 235, 59, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .custom-btn:hover { transform: scale(1.05); }
        .custom-btn:active { transform: scale(0.96); }

        #end-turn-btn {
            background: #00e676;
            color: #013317;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.6);
            animation: pulse-green 1.5s infinite alternate;
        }

        @keyframes pulse-green {
            from { box-shadow: 0 0 8px #00e676; }
            to { box-shadow: 0 0 20px #00e676; }
        }

        .guide-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 6px 14px;
            margin-top: 6px;
            font-size: clamp(0.72rem, 2vw, 0.78rem);
            line-height: 1.4;
            color: #f8bbd0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        /* Adaptive layout for Mobile & Small Tablets */
        @media (max-width: 768px) {
            .game-arena {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }
            .player-dashboard {
                width: 47%;
                padding: 8px 6px;
                order: 1;
            }
            .dashboard-taniska {
                order: 2;
            }
            .board-wrapper {
                order: 3;
                width: min(92vw, 360px);
                margin: 4px auto;
            }
            .player-avatar { font-size: 1.6rem; }
            .player-title { font-size: 1rem; }
            .score-value { font-size: 1.7rem; }
            .guide-box { margin-top: 4px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TANISKA MONDAL GAME HUB</h1>

                <div class="score-value score-taniska" id="score-taniska">0</div>

    <!-- Bottom Action Row -->
    <div class="action-row">
        <button id="end-turn-btn" class="custom-btn" onclick="completeMultiJump()">✅ চাল শেষ করুন</button>
        <button id="reset-btn" class="custom-btn" style="display:none;" onclick="restartGame()">🔄 পরবর্তী রাউন্ড খেলুন</button>

    <div class="guide-box">
        🧠 <b>দেমাগের খেলা:</b> কোনো গ্রিন অ্যারো নেই! বুদ্ধি খাটিয়ে পাশের খালি ঘরে চালুন অথবা প্রতিপক্ষের গুটি ডিঙিয়ে খেয়ে নিন।

    <script>
        /**
         * Authentic 37-Node Traditional Sholo Guti Board Geometry
         * ViewBox: 360 x 520
         * 
         * Nodes 0..5: Top Triangular Fort (6 nodes)
         * Nodes 6..30: Main 5x5 Grid (25 nodes)
         * Nodes 31..36: Bottom Triangular Fort (6 nodes)
         * TOTAL = Exactly 37 Nodes!
         */
        const NODES = [
            // Top Fort (6 nodes: 0..5)
            { id: 0,  x: 180, y: 35 },   // Apex
            { id: 1,  x: 130, y: 75 },   // Mid L
            { id: 2,  x: 230, y: 75 },   // Mid R
            { id: 3,  x: 80,  y: 115 },  // Base L
            { id: 4,  x: 180, y: 115 },  // Base C
            { id: 5,  x: 280, y: 115 },  // Base R

            // Main 5x5 Grid (25 nodes: 6..30)
            // Row 0 (Top line of grid)
            { id: 6,  x: 30,  y: 155 }, { id: 7,  x: 105, y: 155 }, { id: 8,  x: 180, y: 155 }, { id: 9,  x: 255, y: 155 }, { id: 10, x: 330, y: 155 },
            // Row 1
            { id: 11, x: 30,  y: 225 }, { id: 12, x: 105, y: 225 }, { id: 13, x: 180, y: 225 }, { id: 14, x: 255, y: 225 }, { id: 15, x: 330, y: 225 },
            // Row 2 (Middle Neutral Line)
            { id: 16, x: 30,  y: 295 }, { id: 17, x: 105, y: 295 }, { id: 18, x: 180, y: 295 }, { id: 19, x: 255, y: 295 }, { id: 20, x: 330, y: 295 },
            // Row 3
            { id: 21, x: 30,  y: 365 }, { id: 22, x: 105, y: 365 }, { id: 23, x: 180, y: 365 }, { id: 24, x: 255, y: 365 }, { id: 25, x: 330, y: 365 },
            // Row 4 (Bottom line of grid)
            { id: 26, x: 30,  y: 435 }, { id: 27, x: 105, y: 435 }, { id: 28, x: 180, y: 435 }, { id: 29, x: 255, y: 435 }, { id: 30, x: 330, y: 435 },

            // Bottom Fort (6 nodes: 31..36)
            { id: 31, x: 80,  y: 475 },  // Base L
            { id: 32, x: 180, y: 475 },  // Base C
            { id: 33, x: 280, y: 475 },  // Base R
            { id: 34, x: 130, y: 515 },  // Mid L
            { id: 35, x: 230, y: 515 },  // Mid R
            { id: 36, x: 180, y: 555 }   // Apex (Clamped gracefully to bottom)
        ];

        // Ensure bottom apex sits inside viewBox
        NODES[34] = { id: 34, x: 130, y: 510 };
        NODES[35] = { id: 35, x: 230, y: 510 };
        NODES[36] = { id: 36, x: 180, y: 510 }; // Symmetrical base point

        // Traditional Sholo Guti Connections
        const CONNECTIONS = [
            // Top Fort internal
            [0, 1], [0, 2], [1, 2],
            [1, 3], [1, 4], [2, 4], [2, 5],
            [3, 4], [4, 5],
            [0, 4], // Center spine

            // Top Fort to Main Grid Row 0 (nodes 6..10)
            [3, 6], [3, 7], [4, 8], [5, 9], [5, 10],

            // Main 5x5 Grid - Horizontal Lines
            [6, 7],   [7, 8],   [8, 9],   [9, 10],
            [11, 12], [12, 13], [13, 14], [14, 15],
            [16, 17], [17, 18], [18, 19], [19, 20],
            [21, 22], [22, 23], [23, 24], [24, 25],
            [26, 27], [27, 28], [28, 29], [29, 30],

            // Main 5x5 Grid - Vertical Lines
            [6, 11],  [11, 16], [16, 21], [21, 26],
            [7, 12],  [12, 17], [17, 22], [22, 27],
            [8, 13],  [13, 18], [18, 23], [23, 28],
            [9, 14],  [14, 19], [19, 24], [24, 29],
            [10, 15], [15, 20], [20, 25], [25, 30],

            // Main 5x5 Grid - Diagonals
            [6, 12],  [12, 18], [18, 24], [24, 30],
            [10, 14], [14, 18], [18, 22], [22, 26],
            [8, 12],  [12, 16], [8, 14],  [14, 20],
            [16, 22], [22, 28], [20, 24], [24, 28],

            // Bottom Fort to Main Grid Row 4 (nodes 26..30)
            [26, 31], [27, 31], [28, 32], [29, 33], [30, 33],

            // Bottom Fort internal
            [31, 32], [32, 33],
            [31, 34], [32, 34], [32, 35], [33, 35],
            [34, 36], [35, 36], [32, 36]
        ];

        const TOTAL_NODES = 37;
        const ADJACENCY = Array.from({ length: TOTAL_NODES }, () => []);
        CONNECTIONS.forEach(([u, v]) => {
            if (!ADJACENCY[u].includes(v)) ADJACENCY[u].push(v);
            if (!ADJACENCY[v].includes(u)) ADJACENCY[v].push(u);
        });

        // Precompute collinear jump vectors for capturing opponent beads
        const CAPTURE_MAP = {};
        for (let u = 0; u < TOTAL_NODES; u++) {
            CAPTURE_MAP[u] = [];
            ADJACENCY[u].forEach(mid => {
                ADJACENCY[mid].forEach(target => {
                    if (target !== u) {
                        const dx1 = NODES[mid].x - NODES[u].x;
                        const dy1 = NODES[mid].y - NODES[u].y;
                        const dx2 = NODES[target].x - NODES[mid].x;
                        const dy2 = NODES[target].y - NODES[mid].y;

                        const cross = dx1 * dy2 - dy1 * dx2;
                        const dot = dx1 * dx2 + dy1 * dy2;
                        // Linear collinear and strictly forward in the same direction
                        if (Math.abs(cross) < 6 && dot > 0) {
                            CAPTURE_MAP[u].push({ mid, target });
                        }
                    }
                });
            });
        }

        /**
         * Authentic 16 Guti Initial Placement:
         * Top 16 nodes (0 to 15) = BLUE (Baba)
         * Middle 5 nodes (16, 17, 18, 19, 20) = NULL (Empty Battle Line)
         * Bottom 16 nodes (21 to 36) = PINK (Taniska)
         * Zero missing pieces! (16 + 5 + 16 = 37 total nodes)
         */
        function getInitialBoard() {
            const b = Array(TOTAL_NODES).fill(null);
            // Exactly 16 Blue pieces
            for (let i = 0; i <= 15; i++) {
                b[i] = 'BLUE';
            }
            // Nodes 16..20 remain null
            // Exactly 16 Pink pieces
            for (let i = 21; i <= 36; i++) {
                b[i] = 'PINK';
            }
            return b;
        }

        let gameState = {
            board: getInitialBoard(),
            turn: 'BLUE',
            winner: null,
            scoreBaba: 0,
            scoreTaniska: 0
        };

        let peer = null;
        let conn = null;
        let myRole = null; // 'BLUE' (Baba) or 'PINK' (Taniska)
        let selectedIndex = null;
        let isMultiJumping = false;

        // Build Board Visuals & Percentage-anchored Sockets
        function buildBoardVisuals() {
            const svg = document.getElementById('board-svg');
            let linesStr = '';
            CONNECTIONS.forEach(([u, v]) => {
                const p1 = NODES[u];
                const p2 = NODES[v];
                linesStr += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" />`;
            });
            svg.innerHTML = linesStr;

            const container = document.getElementById('nodes-container');
            let nodesHtml = '';
            for (let i = 0; i < TOTAL_NODES; i++) {
                // Responsive percentage anchoring ensures 100% exact alignment on any screen size
                const pctX = (NODES[i].x / 360) * 100;
                const pctY = (NODES[i].y / 520) * 100;
                nodesHtml += `
                    <div class="node-anchor" id="node-${i}" style="left: ${pctX}%; top: ${pctY}%;" onclick="handleNodeClick(${i})">
                        <div class="socket-ring"></div>
                    </div>
                `;
            }
            container.innerHTML = nodesHtml;
        }

        function initApp() {
            buildBoardVisuals();
            peer = new Peer();

            peer.on('open', id => {
                const params = new URLSearchParams(window.location.search);
                const joinId = params.get('game');

                if (joinId) {
                    myRole = 'PINK';
                    document.getElementById('invite-panel').style.display = 'none';
                    connectToHost(joinId);
                } else {
                    myRole = 'BLUE';
                    document.getElementById('turn-announcer').innerText = "তানিস্কার যুক্ত হওয়ার জন্য লিংক পাঠান...";
                }
                updateUI();
            });

            peer.on('connection', connection => {
                conn = connection;
                setupEvents();
            });
        }

        function connectToHost(hostId) {
            conn = peer.connect(hostId);
            setupEvents();
        }

        function setupEvents() {
            conn.on('open', () => {
                setOnline(true);
                if (myRole === 'BLUE') {
                    conn.send({ type: 'SYNC', state: gameState });
                }
                updateUI();
            });

            conn.on('data', data => {
                if (data.type === 'SYNC') {
                    const prevWinner = gameState.winner;
                    gameState = data.state;
                    selectedIndex = null;
                    isMultiJumping = false;
                    clearSelection();
                    updateUI();

                    if (gameState.winner && prevWinner !== gameState.winner) {
                        celebrateWinner(gameState.winner);
                    }
                }
            });

            conn.on('close', () => {
                setOnline(false);
                document.getElementById('turn-announcer').innerText = "সংযোগ বিচ্ছিন্ন হয়েছে!";
            });
        }

        function setOnline(isOnline) {
            const led = document.getElementById('conn-led');
            const txt = document.getElementById('conn-text');
            if (isOnline) {
                led.className = 'conn-dot online';
                txt.innerText = 'অনলাইন';
                txt.style.color = '#00ff66';
            } else {
                led.className = 'conn-dot';
                txt.innerText = 'অফলাইন';
                txt.style.color = '#888';
            }
        }

        function shareGameLink() {
            if (!peer || !peer.id) {
                return;
            }
            const gameUrl = `${window.location.origin}${window.location.pathname}?game=${peer.id}`;
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = gameUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const btn = document.querySelector('.share-btn');
            const oldText = btn.innerText;
            btn.innerText = "✅ লিংক কপি হয়েছে!";
            setTimeout(() => { btn.innerText = oldText; }, 2500);
        }

        function handleNodeClick(index) {
            if (gameState.winner) return;

            if (!conn || !conn.open) {
                return;
            }

            if (gameState.turn !== myRole) return;

            const clickedPiece = gameState.board[index];

            // In continuous capture mode, must continue with same piece
            if (isMultiJumping) {
                if (clickedPiece === null) {
                    attemptJump(selectedIndex, index);
                }
                return;
            }

            // 1. Select Own Piece (Only subtle 3D float + gold glow, strictly NO GREEN ARROWS)
            if (clickedPiece === myRole) {
                selectedIndex = index;
                clearSelection();
                document.getElementById(`node-${index}`).classList.add('selected');
                return;
            }

            // 2. Click Empty Target with selected bead
            if (selectedIndex !== null && clickedPiece === null) {
                // A) Regular Move (1 Step along connected edge)
                if (ADJACENCY[selectedIndex].includes(index)) {
                    gameState.board[index] = myRole;
                    gameState.board[selectedIndex] = null;
                    selectedIndex = null;
                    clearSelection();

                    finishTurn();
                    return;
                }

                // B) Jump Capture Move
                attemptJump(selectedIndex, index);
            }
        }

        function attemptJump(fromIndex, toIndex) {
            const opponent = (myRole === 'BLUE') ? 'PINK' : 'BLUE';
            const possibleCaptures = CAPTURE_MAP[fromIndex] || [];
            const capture = possibleCaptures.find(c => c.target === toIndex && gameState.board[c.mid] === opponent);

            if (capture) {
                // Execute Capture
                gameState.board[toIndex] = myRole;
                gameState.board[fromIndex] = null;
                gameState.board[capture.mid] = null; // Remove eaten bead

                selectedIndex = toIndex;
                clearSelection();
                document.getElementById(`node-${toIndex}`).classList.add('selected');

                // Check if further jump is possible with the same piece
                const nextCaptures = (CAPTURE_MAP[toIndex] || []).filter(c => 
                    gameState.board[c.target] === null && gameState.board[c.mid] === opponent
                );

                if (nextCaptures.length > 0) {
                    isMultiJumping = true;
                    document.getElementById('end-turn-btn').style.display = 'inline-block';
                    updateUI();
                    syncState();
                } else {
                    isMultiJumping = false;
                    selectedIndex = null;
                    clearSelection();
                    finishTurn();
                }
            }
        }

        function completeMultiJump() {
            if (isMultiJumping) {
                isMultiJumping = false;
                selectedIndex = null;
                clearSelection();
                document.getElementById('end-turn-btn').style.display = 'none';
                finishTurn();
            }
        }

        function finishTurn() {
            document.getElementById('end-turn-btn').style.display = 'none';

            const blueAlive = gameState.board.filter(c => c === 'BLUE').length;
            const pinkAlive = gameState.board.filter(c => c === 'PINK').length;

            if (pinkAlive === 0) {
                gameState.winner = 'BLUE';
                gameState.scoreBaba++;
                celebrateWinner('BLUE');
            } else if (blueAlive === 0) {
                gameState.winner = 'PINK';
                gameState.scoreTaniska++;
                celebrateWinner('PINK');
            } else {
                gameState.turn = (myRole === 'BLUE') ? 'PINK' : 'BLUE';
            }

            syncState();
            updateUI();
        }

        function syncState() {
            if (conn && conn.open) {
                conn.send({ type: 'SYNC', state: gameState });
            }
        }

        function clearSelection() {
            for (let i = 0; i < TOTAL_NODES; i++) {
                const el = document.getElementById(`node-${i}`);
                if (el) el.classList.remove('selected');
            }
        }

        function celebrateWinner(winner) {
            const cardId = (winner === 'BLUE') ? 'card-baba' : 'card-taniska';
            const cardEl = document.getElementById(cardId);
            const rect = cardEl.getBoundingClientRect();

            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            const colors = (winner === 'BLUE') 
                ? ['#00d2ff', '#0077b6', '#ffffff', '#ffd54f'] 
                : ['#ff2a85', '#ff77a9', '#ffffff', '#ffeb3b'];

            let end = Date.now() + 2600;
            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 65,
                    origin: { x: Math.max(0, x - 0.05), y: y },
                    colors: colors
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 65,
                    origin: { x: Math.min(1, x + 0.05), y: y },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function restartGame() {
            // Keep cumulative scores intact, reset only board layout
            gameState.board = getInitialBoard();
            gameState.turn = (gameState.winner === 'BLUE') ? 'PINK' : 'BLUE';
            gameState.winner = null;
            selectedIndex = null;
            isMultiJumping = false;
            clearSelection();
            document.getElementById('end-turn-btn').style.display = 'none';

            syncState();
            updateUI();
        }

        function updateUI() {
            const boardWrapper = document.getElementById('board-wrapper');
            const announcer = document.getElementById('turn-announcer');
            const resetBtn = document.getElementById('reset-btn');

            const scoreBabaEl = document.getElementById('score-baba');
            const scoreTaniskaEl = document.getElementById('score-taniska');
            const aliveBabaEl = document.getElementById('alive-baba');
            const aliveTaniskaEl = document.getElementById('alive-taniska');

            const cardBaba = document.getElementById('card-baba');
            const cardTaniska = document.getElementById('card-taniska');
            const crownBaba = document.getElementById('crown-baba');
            const crownTaniska = document.getElementById('crown-taniska');

            // 1. Digital Scores & Alive Counts
            scoreBabaEl.innerText = gameState.scoreBaba;
            scoreTaniskaEl.innerText = gameState.scoreTaniska;

            const blueAlive = gameState.board.filter(c => c === 'BLUE').length;
            const pinkAlive = gameState.board.filter(c => c === 'PINK').length;
            aliveBabaEl.innerText = blueAlive;
            aliveTaniskaEl.innerText = pinkAlive;

            // 2. Render Marbles (Exactly 16 Blue and 16 Pink on new game)
            for (let i = 0; i < TOTAL_NODES; i++) {
                const nodeEl = document.getElementById(`node-${i}`);
                if (!nodeEl) continue;

                const existingGuti = nodeEl.querySelector('.guti');
                if (existingGuti) existingGuti.remove();

                if (gameState.board[i] === 'BLUE') {
                    const g = document.createElement('div');
                    g.className = 'guti guti-blue';
                    nodeEl.appendChild(g);
                } else if (gameState.board[i] === 'PINK') {
                    const g = document.createElement('div');
                    g.className = 'guti guti-pink';
                    nodeEl.appendChild(g);
                }
            }

            // 3. Reset Winner Cards
            cardBaba.classList.remove('winner-active');
            cardTaniska.classList.remove('winner-active');
            crownBaba.style.display = 'none';
            crownTaniska.style.display = 'none';

            // 4. Winner State
            if (gameState.winner) {
                boardWrapper.classList.add('board-locked');
                resetBtn.style.display = 'inline-block';

                if (gameState.winner === 'BLUE') {
                    cardBaba.classList.add('winner-active');
                    crownBaba.style.display = 'block';
                    announcer.innerHTML = (myRole === 'BLUE') ? "🏆 বাবা এই রাউন্ডে জিতে গেছেন! 🎆" : "বাবা জিতে গেছেন! পরের রাউন্ডে জিতুন!";
                    announcer.style.color = "#00e5ff";
                } else {
                    cardTaniska.classList.add('winner-active');
                    crownTaniska.style.display = 'block';
                    announcer.innerHTML = "🎉 তানিস্কা এই রাউন্ডে জিতে গেছে! 🥳👑";
                    announcer.style.color = "#ff4081";
                }
                return;
            }

            resetBtn.style.display = 'none';

            // 5. Turn Handling & Ludo-style Strict Board Lock
            if (!conn || !conn.open) {
                boardWrapper.classList.add('board-locked');
                return;
            }

            if (gameState.turn === myRole) {
                boardWrapper.classList.remove('board-locked');
                if (isMultiJumping) {
                    announcer.innerText = "💥 আরও গুটি খাওয়ার সুযোগ আছে অথবা 'চাল শেষ করুন' চাপুন।";
                    announcer.style.color = "#00e676";
                } else {
                    announcer.innerText = "🎲 আপনার চাল! নিজের বুদ্ধি খাটিয়ে চালুন।";
                    announcer.style.color = "#ffeb3b";
                }
            } else {
                boardWrapper.classList.add('board-locked');
                const waitingName = (myRole === 'BLUE') ? "তানিস্কার" : "বাবার";
                announcer.innerText = `⏳ ${waitingName} চালের জন্য অপেক্ষা করুন...`;
                announcer.style.color = "#f48fb1";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
